[project]
name = "hackingBuddyGPT"
# original author was Andreas Happe, for an up-to-date list see
# https://github.com/ipa-lab/hackingBuddyGPT/graphs/contributors
authors = [
	{ name = "HackingBuddyGPT maintainers", email = "maintainers@hackingbuddy.ai" }
]
maintainers = [
	{ name = "Andreas Happe", email = "andreas@offensive.one" },
	{ name = "Juergen Cito", email = "juergen.cito@tuwien.ac.at" }
]
description = "Helping Ethical Hackers use LLMs in 50 lines of code"
readme = "README.md"
keywords = ["hacking", "pen-testing", "LLM", "AI", "agent"]
requires-python = ">=3.13"
version = "0.5.0"
license = { file = "LICENSE" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
	"Development Status :: 4 - Beta",
]
dependencies = [
    'fabric == 3.2.2',
    'Mako == 1.3.2',
    'requests == 2.32.5',
    'rich == 13.7.1',
    # litellm is the single LLM upstream. It pulls openai in transitively, but the project no
    # longer depends on or imports openai (or instructor) directly.
    'litellm',
    'PyYAML == 6.0.1',
    'python-dotenv == 1.0.1',
    'pypsexec == 0.3.0',
    'pydantic == 2.8.2',
    'BeautifulSoup4',
    'faker',
    'fpdf',
]

[project.urls]
Homepage = "https://www.hackingbuddy.ai"
Documentation = "https://docs.hackingbuddy.ai"
Repository = "https://github.com/ipa-lab/hackingBuddyGPT"
"Bug Tracker" = "https://github.com/ipa-lab/hackingBuddyGPT/issues"

[build-system]
requires = ["uv_build>=0.8.16,<0.9.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
# the distribution name normalizes to "hackingbuddygpt"; the source lives under the mixed-case
# directory, so pin the module name explicitly.
module-name = "hackingBuddyGPT"

[tool.pytest.ini_options]
pythonpath = "src"
addopts = ["--import-mode=importlib"]

[project.optional-dependencies]
testing = [
	'pytest',
	'pytest-mock',
	'faker',
	'langchain_core'
]

dev = [
	'ruff',
]

rag = [
	'langchain_core',
	'langchain-community',
	'langchain-chroma',
	'langchain-openai',
	'markdown',
	'chromadb',
]

[project.scripts]
wintermute = "hackingBuddyGPT.cli.wintermute:main"
hackingBuddyGPT = "hackingBuddyGPT.cli.wintermute:main"
hackingbuddygpt-log-view = "hackingBuddyGPT.cli.log_viewer:main"
hackingbuddygpt-log-analyze = "hackingBuddyGPT.cli.log_analyze:main"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "B", "I"]
ignore = ["E501", "F401", "F403"]
